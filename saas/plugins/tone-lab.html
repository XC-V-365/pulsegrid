<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Tone lab</title>
<style>body{font-family:system-ui;background:#060a12;color:#e8ecf4;padding:1.5rem}a{color:#d4a574}button{margin:.3rem;padding:.4rem .7rem;cursor:pointer}</style></head>
<body><h1>Tone.js optional lab</h1>
<p><a href="index.html">Plugins</a> · <a href="../../step-sequencer.html">Sequencer</a></p>
<button id="l">Load Tone</button><button id="b">Demo beep</button><pre id="o"></pre>
<script src="tone-shim.js"></script>
<script>
l.onclick=async()=>{try{await PulseGridPlugins.loadTone();o.textContent="Tone "+(Tone.version||"ok")}catch(e){o.textContent=String(e)}};
b.onclick=async()=>{try{o.textContent=await PulseGridPlugins.demoBeep()}catch(e){o.textContent=e.message||e}};
</script></body></html>
